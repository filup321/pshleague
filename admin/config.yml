# ============================================================================
# PSH League CMS config
# ----------------------------------------------------------------------------
# Fill in the two placeholders below (YOUR_GITHUB_USERNAME and the worker URL),
# then commit. See README.md for the full setup walkthrough.
# ============================================================================

backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/pshleague   # <-- change to your repo, e.g. pshuser/pshleague
  branch: main
  # URL of the Cloudflare OAuth worker you deploy (see cloudflare-oauth-worker/).
  # Example: https://pshleague-cms-auth.YOURNAME.workers.dev
  base_url: https://YOUR-OAUTH-WORKER.workers.dev
  auth_endpoint: /auth

# Uploaded images land here in the repo and are served from the site root.
media_folder: "media/uploads"
public_folder: "/media/uploads"

# Keeps an "unpublished" state off; every save commits straight to the branch.
publish_mode: simple

collections:
  - name: "content"
    label: "PSH League"
    files:
      - name: "posts"
        label: "Posts  (Blogs / Videos / Pictures)"
        file: "content/posts.json"
        format: json
        fields:
          - name: posts
            label: "Posts"
            label_singular: "Post"
            widget: list
            summary: "{{fields.date}}  —  {{fields.title}}  [{{fields.type}}]"
            fields:
              - { name: type, label: "Type", widget: select, default: "blog",
                  options: [ { label: "Blog post", value: "blog" },
                             { label: "Video", value: "video" },
                             { label: "Picture(s)", value: "picture" } ] }
              - { name: title, label: "Title", widget: string }
              - { name: date, label: "Date", widget: datetime,
                  date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { name: author, label: "Author", widget: string, required: false, default: "PSH League" }
              - { name: author_image, label: "Author photo (shown as a round avatar on the post)", widget: image, required: false }
              - { name: body, label: "Body (markdown)", widget: markdown, required: false }
              - { name: image, label: "Main image", widget: image, required: false }
              - { name: video_url, label: "Video URL (YouTube / Vimeo)", widget: string, required: false }
              - name: gallery
                label: "Photo gallery"
                widget: list
                required: false
                field: { name: src, label: "Image", widget: image }

      - name: "settings"
        label: "Site settings"
        file: "content/settings.json"
        format: json
        fields:
          - { name: marquee_text, label: "Scrolling banner text", widget: string }
          - { name: contact_number, label: "Contact number (footer)", widget: string, required: false }
          - { name: visitor_count, label: "Visitor counter (cosmetic)", widget: string, required: false }
          - { name: stats_pdf, label: "Stats PDF (shown on the Stats section)", widget: file, required: false }
          - name: standings
            label: "Standings (only shown if no Stats PDF is set)"
            widget: list
            required: false
            summary: "{{fields.team}}  ({{fields.wins}}-{{fields.losses}})"
            fields:
              - { name: team, label: "Team", widget: string }
              - { name: wins, label: "Wins", widget: number, value_type: int, default: 0 }
              - { name: losses, label: "Losses", widget: number, value_type: int, default: 0 }
